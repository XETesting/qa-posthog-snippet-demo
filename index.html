  <h1>qa-posthog snippet demo</h1>
  <p>Minimal static page for PostHog connector QA (project <code>qa-posthog</code> / 633060).</p>

  <p>
    <button type="button" id="btn-signup">Capture qa_posthog_signup</button>
    <button type="button" id="btn-purchase">Capture qa_posthog_purchase</button>

  </p>
  <p id="status" aria-live="polite"></p>
  <script>
    function status(msg) {
      document.getElementById('status').textContent = msg;
    }
    document.getElementById('btn-signup').addEventListener('click', function () {
      posthog.capture('qa_posthog_signup', { source: 'snippet-demo', qa_seed: 'path-c-web' });
      status('Sent qa_posthog_signup');
    });
    document.getElementById('btn-purchase').addEventListener('click', function () {
      posthog.capture('qa_posthog_purchase', { source: 'snippet-demo', amount: 9.99, qa_seed: 'path-c-web' });
      status('Sent qa_posthog_purchase');
    });
    document.getElementById('btn-identify').addEventListener('click', function () {
      posthog.identify('qa-posthog-user-web', { email: 'qa-posthog-web@example.com', qa_seed: 'path-c-web' });
      status('Identified as qa-posthog-user-web');
    });
  </script>
